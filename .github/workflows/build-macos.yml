name: Build macOS companion
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.0
      - run: python -m unittest discover -s companion -p 'test*.py'
      - run: bash -n companion/mac/*.command
      - run: python -m PyInstaller --onefile --name AzerothWeatherCompanion --distpath mac-dist companion/companion.py
      - name: Test packaged app with an empty game folder
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/empty"
          ./mac-dist/AzerothWeatherCompanion --once --root "$HOME/empty" --addon-dir "$HOME/empty"
          grep -q 'Started.' "$HOME/Library/Application Support/AzerothWeatherCompanion/companion.log"
      - run: |
          cp companion/mac/*.command mac-dist/
          chmod +x mac-dist/*.command
          cd mac-dist && zip -yr ../AzerothWeatherCompanion-macOS-${{ matrix.arch }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: AzerothWeatherCompanion-macOS-${{ matrix.arch }}.zip
